// ==============================================================================================
// /**
//  * @file        build.gradle
//  * @module      Thinklab Hash Service Build Manifest (Groovy DSL)
//  * @description Comprehensive build lifecycle orchestration. This manifest defines
//  *              compilation phases, dependency resolution, Abstract Syntax Tree (AST)
//  *              manipulation, Ahead-of-Time (AOT) optimizations, and Fat JAR packaging.
//  *              Adheres to strict Zero-Trust, reproducible builds, and deterministic protocols.
//  *
//  * @maintainer  Thinklab Systems Engineering Team
//  * @java_target JDK 21 (LTS) - Virtual Threads & Pattern Matching enabled
//  */
// ==============================================================================================

plugins {
    id 'io.micronaut.application' version '4.4.2'
    id 'io.micronaut.aot'         version '4.4.2'
    id 'com.gradleup.shadow'      version '8.3.0'
}

group   = 'com.thinklab'
version = '0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.thinklab.Application'
}

repositories {
    mavenCentral()
}

dependencies {
    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       AST Manipulation & Compile-time Processors
    //  * @description Synthesizes boilerplate and generates Micronaut DI/SerDes metadata.
    //  * @note        ORDER IS CRITICAL: Lombok must run before Micronaut processors.
    //  */
    // ------------------------------------------------------------------------------------------
    annotationProcessor    'org.projectlombok:lombok:1.18.36'
    compileOnly            'org.projectlombok:lombok:1.18.36'

    annotationProcessor    'io.micronaut:micronaut-http-validation'
    annotationProcessor    'io.micronaut.serde:micronaut-serde-processor'
    annotationProcessor    'io.micronaut.validation:micronaut-validation-processor'
    annotationProcessor    'io.micronaut.data:micronaut-data-document-processor'
    annotationProcessor    'io.micronaut.openapi:micronaut-openapi'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Core Application & Management
    //  * @description Foundational framework components, HTTP clients, and validation.
    //  */
    // ------------------------------------------------------------------------------------------
    implementation         'io.micronaut:micronaut-management'
    implementation         'io.micronaut:micronaut-http-client'
    implementation         'io.micronaut.serde:micronaut-serde-jackson'
    implementation         'io.micronaut.validation:micronaut-validation'
    implementation         'io.swagger.core.v3:swagger-annotations'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Observability & Structured Logging
    //  * @description JSON-formatted log emission and runtime bootstrapping.
    //  * @note        Logstash requires standard jackson-databind to serialize events.
    //  */
    // ------------------------------------------------------------------------------------------
    runtimeOnly             ("net.logstash.logback:logstash-logback-encoder:7.4")
    runtimeOnly            'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly            'ch.qos.logback:logback-classic'
    runtimeOnly            'org.yaml:snakeyaml'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Infrastructure & Data Persistence (Reactive)
    //  * @description Non-blocking MongoDB drivers and Project Reactor core.
    //  */
    // ------------------------------------------------------------------------------------------
    implementation         'io.projectreactor:reactor-core'
    implementation         'io.micronaut.data:micronaut-data-mongodb'
    implementation         'io.micronaut.mongodb:micronaut-mongo-reactive'
    implementation         'org.mongodb:mongodb-driver-reactivestreams'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Cryptography & Security
    //  * @description Cryptographic primitives and zero-trust policy enforcements.
    //  */
    // ------------------------------------------------------------------------------------------
    implementation         'org.bouncycastle:bcprov-jdk18on:1.85'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Quality Assurance & Unit Testing
    //  * @description Test harnesses, mocking frameworks, and JUnit 5 launchers.
    //  */
    // ------------------------------------------------------------------------------------------
    testImplementation     'io.micronaut:micronaut-http-client'
    testImplementation     'io.projectreactor:reactor-test'
    testImplementation     'org.mockito:mockito-core'
    testImplementation     'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly        'org.junit.platform:junit-platform-launcher'
}

// ==============================================================================================
// /**
//  * @directive   Compiler Options & Telemetry
//  * @description Enforces strict compilation rules (UTF-8, warnings) and injects JVM
//  *              arguments for OpenAPI/Swagger UI generation.
//  */
// ==============================================================================================
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << '-parameters' << '-Xlint:unchecked' << '-Xlint:deprecation'
    options.fork = true
    options.forkOptions.jvmArgs << '-Dmicronaut.openapi.views.spec=swagger-ui.enabled=true,swagger-ui.theme=flattop'
}

// ==============================================================================================
// /**
//  * @directive   Fat JAR Security & Packaging Optimization (Shadow Plugin)
//  * @description Merges service files safely. CRITICAL: Strips cryptographic signature files
//  *              (.RSA, .DSA, .SF) inherited from third-party JARs (like BouncyCastle)
//  *              to prevent JVM SecurityExceptions at runtime.
//  */
// ==============================================================================================
tasks.named("shadowJar") {
    mergeServiceFiles()
    exclude 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.SF'
    exclude 'META-INF/INDEX.LIST'
}

// ==============================================================================================
// /**
//  * @directive   Cloud-Native Reproducible Builds
//  * @description Strips volatile timestamps and enforces deterministic file ordering within
//  *              archives. Guarantees bit-for-bit identical JARs to maximize Docker
//  *              layer cache hits in CI/CD pipelines.
//  */
// ==============================================================================================
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// ==============================================================================================
// /**
//  * @directive   CI/CD Test Execution Strategy
//  * @description Optimizes test runs for headless environments. Enables fail-fast semantics
//  *              and dynamic parallel execution based on available CPU cores.
//  */
// ==============================================================================================
tasks.named('test') {
    useJUnitPlatform()
    failFast = true // Aborts immediately on first failure (saves CI minutes)
    maxParallelForks = (Runtime.runtime.availableProcessors().intdiv(2) ?: 1)

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat 'full'
    }
}

// ==============================================================================================
// /**
//  * @directive   GraalVM Native Image
//  * @description Defines native binary compilation arguments and memory boundaries.
//  */
// ==============================================================================================
graalvmNative {
    toolchainDetection = false
    binaries {
        all {
            buildArgs.add('-H:+SharedArenaSupport')
        }
    }
}

// ==============================================================================================
// /**
//  * @directive   Ahead-of-Time (AOT) Config & Micronaut Engine
//  * @description Fine-tunes compile-time initializations to reduce startup latency.
//  */
// ==============================================================================================
micronaut {
    version "4.4.2"
    runtime("netty")
    testRuntime("junit5")

    processing {
        incremental(true)
        annotations("com.thinklab.*")
    }

    aot {
        optimizeServiceLoading = false
        convertYamlToJava      = false
        precomputeOperations   = true
        cacheEnvironment       = true
        optimizeClassLoading   = true
        deduceEnvironment      = true
        optimizeNetty          = true

        // CRITICAL: Must be false to prevent AOT parser from breaking Logstash <encoder> tags
        replaceLogbackXml      = false
    }
}