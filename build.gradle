// ==============================================================================================
// /**
//  * @file        build.gradle
//  * @module      Thinklab Hash Service Build Manifest & Pipeline Orchestration (Groovy DSL)
//  * @version     v3.4.1-NASA-SRE-PROD-STABLE
//  * @description Enterprise-grade, zero-trust build orchestration manifest utilizing Micronaut 4
//  *              native Ahead-of-Time (AOT) and optimized JAR packaging. Explicitly binds full
//  *              OpenTelemetry platform libraries and BOM alignment to eradicate any runtime
//  *              NoClassDefFoundError risks. Fully compatible with modern Gradle v8.x/v9.x engines.
//  *
//  * @architectural_directives
//  *   1. Identity Sovereignty: Strict UUID enforcement across all domain layers.
//  *   2. Non-Blocking Reactive First: Fully driven by Project Reactor and Netty EventLoops.
//  *   3. Cryptographic Hardening: Bundles BouncyCastle primitives with zero signature conflicts.
//  *   4. Observability Mesh: Native OpenTelemetry W3C trace-context injection & log correlation.
//  *
//  * @maintainer  Thinklab Core Infrastructure & High-Assurance Engineering Team
//  * @java_target JDK 21 LTS (Virtual Threads, Pattern Matching, Record Patterns fully enabled)
//  */
// ==============================================================================================

plugins {
    id 'io.micronaut.application' version '4.4.2'
    id 'io.micronaut.aot'         version '4.4.2'
}

group   = 'com.thinklab'
version = '0.1.0-SNAPSHOT'

// ==============================================================================================
// /**
//  * @directive   Java Toolchain & Runtime Environment Sovereignty
//  * @description Enforces strict compliance with JDK 21 LTS toolchain to harness Project Loom
//  *              Virtual Threads, enhanced Switch expressions, and optimized memory footprints.
//  */
// ==============================================================================================
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// ==============================================================================================
// /**
//  * @directive   Application Entry Point Definition
//  * @description Directs runtime execution paths to the high-assurance bootstrap class.
//  */
// ==============================================================================================
application {
    mainClass = 'com.thinklab.Application'
}

repositories {
    mavenCentral()
}

// ==============================================================================================
// /**
//  * @directive   Dependency Version Alignment (BOM / Platform Management)
//  * @description Guarantees unified transitive version locking across OpenTelemetry modules
//  *              to prevent version skew and missing class signature conflicts at runtime.
//  */
// ==============================================================================================
dependencies {
    implementation platform("io.opentelemetry:opentelemetry-bom:1.38.0")
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:2.3.0")

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       AST Manipulation & Compile-time Metaprogramming Processors
    //  * @description Synthesizes boilerplates, Immutable records, and Micronaut DI reflection maps.
    //  * @note        CRITICAL COMPILATION ORDER: Lombok annotation processor MUST precede
    //  *              Micronaut processing nodes to prevent missing getter/setter symbol failures.
    //  */
    // ------------------------------------------------------------------------------------------
    annotationProcessor    'org.projectlombok:lombok:1.18.36'
    compileOnly            'org.projectlombok:lombok:1.18.36'

    annotationProcessor    'io.micronaut:micronaut-http-validation'
    annotationProcessor    'io.micronaut.serde:micronaut-serde-processor'
    annotationProcessor    'io.micronaut.validation:micronaut-validation-processor'
    annotationProcessor    'io.micronaut.data:micronaut-data-document-processor'
    annotationProcessor    'io.micronaut.openapi:micronaut-openapi'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Core Application Framework & High-Performance Web Services
    //  * @description Management endpoints, non-blocking HTTP clients, Jackson serialization,
    //  *              and OpenAPI documentation metadata generation bindings.
    //  */
    // ------------------------------------------------------------------------------------------
    implementation         'io.micronaut:micronaut-management'
    implementation         'io.micronaut:micronaut-http-client'
    implementation         'io.micronaut.serde:micronaut-serde-jackson'
    implementation         'io.micronaut.validation:micronaut-validation'
    implementation         'io.swagger.core.v3:swagger-annotations'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Distributed Tracing & SRE Observability Mesh (ADR-010)
    //  * @description End-to-end OpenTelemetry instrumentation for W3C distributed trace context
    //  *              propagation, span metrics, and OTLP network telemetry export.
    //  */
    // ------------------------------------------------------------------------------------------
    implementation         'io.opentelemetry:opentelemetry-api'
    implementation         'io.opentelemetry:opentelemetry-sdk'
    implementation         'io.micronaut.tracing:micronaut-tracing-opentelemetry-http'
    implementation         'io.opentelemetry:opentelemetry-exporter-otlp'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Structured Telemetry & Log Emission
    //  * @description JSON-formatted enterprise log encoders and standard diagnostic binders.
    //  */
    // ------------------------------------------------------------------------------------------
    runtimeOnly            'net.logstash.logback:logstash-logback-encoder:7.4'
    runtimeOnly            'com.fasterxml.jackson.core:jackson-databind'
    runtimeOnly            'ch.qos.logback:logback-classic'
    runtimeOnly            'org.yaml:snakeyaml'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Infrastructure & Data Persistence (Reactive)
    //  * @description Project Reactor event-loop management coupled with non-blocking MongoDB drivers.
    //  */
    // ------------------------------------------------------------------------------------------
    implementation         'io.projectreactor:reactor-core'
    implementation         'io.micronaut.data:micronaut-data-mongodb'
    implementation         'io.micronaut.mongodb:micronaut-mongo-reactive'
    implementation         'org.mongodb:mongodb-driver-reactivestreams'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       High-Assurance Cryptography & Security Primitives
    //  * @description Provides robust cryptographic algorithms (SHA-3, HMAC, Ed25519) via BouncyCastle.
    //  */
    // ------------------------------------------------------------------------------------------
    implementation         'org.bouncycastle:bcprov-jdk18on:1.85'

    // ------------------------------------------------------------------------------------------
    // /**
    //  * @layer       Quality Assurance, Isolation & Test Harnesses
    //  * @description Zero-infrastructure test environments utilizing Mockito frameworks and StepVerifier.
    //  */
    // ------------------------------------------------------------------------------------------
    testImplementation     'io.micronaut:micronaut-http-client'
    testImplementation     'io.projectreactor:reactor-test'
    testImplementation     'org.mockito:mockito-core'
    testImplementation     'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly        'org.junit.platform:junit-platform-launcher'
}

// ==============================================================================================
// /**
//  * @directive   Compiler Compilation Directives & Diagnostics
//  * @description Enforces strict UTF-8 text encoding, injects parameter name retention metadata
//  *              for runtime reflection safety, and configures Swagger UI theme arguments.
//  */
// ==============================================================================================
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs << '-parameters' << '-Xlint:unchecked' << '-Xlint:deprecation'
    options.fork = true
    options.forkOptions.jvmArgs << '-Dmicronaut.openapi.views.spec=swagger-ui.enabled=true,swagger-ui.theme=flattop'
}

// ==============================================================================================
// /**
//  * @directive   Cloud-Native Reproducible Build Protocol
//  * @description Strips volatile timestamps and enforces strict deterministic file-entry sorting
//  *              within archive structures. Guarantees bit-for-bit identical outputs for identical sources.
//  */
// ==============================================================================================
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// ==============================================================================================
// /**
//  * @directive   CI/CD Test Strategy & Fail-Fast Concurrency
//  * @description Optimizes test execution performance. Aborts pipelines immediately on the first
//  *              test failure (failFast) to conserve CI runner minutes, and dynamically allocates
//  *              parallel fork workers based on available host CPUs.
//  */
// ==============================================================================================
tasks.named('test') {
    useJUnitPlatform()
    failFast = true
    maxParallelForks = (Runtime.runtime.availableProcessors().intdiv(2) ?: 1)

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat 'full'
    }
}

// ==============================================================================================
// /**
//  * @directive   GraalVM Native Image Compilation Directives
//  * @description Prepares container image build parameters for ahead-of-time native binary generation.
//  */
// ==============================================================================================
graalvmNative {
    toolchainDetection = false
    binaries {
        all {
            buildArgs.add('-H:+SharedArenaSupport')
        }
    }
}

// ==============================================================================================
// /**
//  * @directive   Ahead-of-Time (AOT) Configuration & Micronaut Engine Tuning
//  * @description Optimizes container boot latency and runtime memory footprint by shifting
//  *              reflection analysis and service loader initialization phases to compile-time.
//  */
// ==============================================================================================
micronaut {
    version "4.4.2"
    runtime("netty")
    testRuntime("junit5")

    processing {
        incremental(true)
        annotations("com.thinklab.*")
    }

    aot {
        optimizeServiceLoading = true
        convertYamlToJava      = false
        precomputeOperations   = true
        cacheEnvironment       = true
        optimizeClassLoading   = true
        deduceEnvironment      = true
        optimizeNetty          = true

        // SECURITY NOTE: Must remain false to prevent the AOT parser from breaking Logstash layout XML tags
        replaceLogbackXml      = false
    }
}