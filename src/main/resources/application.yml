# ==============================================================================================
# /**
#  * @file        application.yml
#  * @module      Thinklab Hash Service Core Configuration
#  * @description Centralized configuration manifest for the Micronaut 4.x runtime.
#  * Orchestrates application identity, Netty reactive engine, OpenAPI/Swagger
#  * documentation, health/metrics telemetry, and high-performance database
#  * connection pooling. Adheres to cloud-native and 12-factor app principles.
#  *
#  * @maintainer  Thinklab Systems Engineering Team
#  * @target      Production (Mission-Critical NASA-Level Standard)
#  */
# ==============================================================================================

micronaut:
  application:
    name: thinklab-hash-service
    instance:
      id: ${random.shortuuid}

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Netty HTTP Server & Reactive Engine
  #  * @description Optimized for non-blocking I/O (Project Reactor) and container limits.
  #  *              Includes graceful shutdown and aggressive connection recycling to
  #  *              prevent zombie sockets behind Kubernetes Ingress/AWS ALB.
  #  */
  # ----------------------------------------------------------------------------------------------
  server:
    port: ${MICRONAUT_SERVER_PORT:8080}
    cors:
      enabled: true
    # Prevents slowloris attacks and connection leaks
    idle-timeout: 60s
    netty:
      max-header-size: 8192
      worker:
        # 0 = Framework automatically calculates based on available CPU cores
        threads: ${NETTY_WORKER_THREADS:0}
      # Kubernetes Zero-Downtime Guarantee: Allows inflight requests to finish before killing the pod
      shutdown-quiet-period: 2s
      shutdown-timeout: 10s

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  Serialization Engine (Micronaut Serde)
  #  * @description Reflection-free AOT JSON serialization settings.
  #  *              Optimized for minimal payload footprint and forward-compatibility.
  #  */
  # ----------------------------------------------------------------------------------------------
  serde:
    write-dates-as-timestamps: false
    deserialization:
      # Forward Compatibility: Prevents breaking if new fields are sent by clients
      ignore-unknown: true
    serialization:
      # Network Optimization: Strips out null fields to reduce JSON payload sizes
      inclusion: NON_NULL

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  OpenAPI / Swagger Routing
  #  * @description Maps static classpath resources generated by the 'micronaut-openapi'
  #  * annotation processor during the build compilation phase. Exposes the
  #  * API contract and Swagger UI.
  #  */
  # ----------------------------------------------------------------------------------------------
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Management Endpoints, Observability & Telemetry
#  * @description Exposes structural application telemetry and dynamic management interfaces.
#  * - health: Kubernetes native probes (Liveness/Readiness).
#  * - metrics/prometheus: Exposes JVM, Netty, and MongoDB metrics to scrapers.
#  * - loggers: Allows real-time log level mutation without JVM restarts.
#  *
#  * @security    Ensure /endpoints are blocked at the Ingress/API Gateway level from
#  *              public access. They are exposed here strictly for internal scraping.
#  */
# ----------------------------------------------------------------------------------------------
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    kubernetes:
      enabled: true
  metrics:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false
  loggers:
    enabled: true
    sensitive: false
  info:
    enabled: true
    sensitive: false

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Data Persistence / Reactive MongoDB Driver
#  * @description Configures the MongoDB driver with production-grade constraints.
#  * Implements a robust connection pool topology, aggressive socket timeouts
#  * to prevent thread starvation, and majority write concerns to ensure
#  * strict data durability and consistency across replica sets.
#  *
#  * @tuning      uuid-representation: STANDARD - Mandated to resolve BSON CodecConfigurationException.
#  * @resilience  Fail-fast semantics applied to server selection to prevent cascasing failures.
#  */
# ----------------------------------------------------------------------------------------------
mongodb:
  uri: ${MONGODB_URI:`mongodb://localhost:27017/thinklab_hash_db`}
  uuid-representation: STANDARD
  cluster:
    # Fail-Fast: Do not hang the app for 30s (default) if the DB is unreachable
    server-selection-timeout: 5000ms
  connection-pool:
    max-size: 100
    min-size: 10
    max-wait-time: 12000ms
    # Recycles connections idling for over 1 minute to prevent network staleness
    max-connection-idle-time: 60000ms
  socket:
    connect-timeout: 5000ms
    read-timeout: 10000ms
  write-concern:
    w: majority
    journal: true
  retry-writes: true

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Eager Initialization / Dependency Warm-up
#  * @description Configures external target URLs for the ExternalEndpointsHealthIndicator.
#  * These endpoints are proactively pinged during the application StartupEvent
#  * to resolve DNS, establish TCP connections, and complete SSL handshakes
#  * before the application accepts external traffic.
#  */
# ----------------------------------------------------------------------------------------------
warmup:
  endpoints:
    google-search: "https://www.google.com"