# ==============================================================================================
# /**
#  * @file        application.yml
#  * @module      Micronaut Hash Service Core Configuration
#  * @description Centralized configuration manifest for the Micronaut runtime.
#  * Orchestrates application identity, network topology, OpenAPI/Swagger
#  * documentation, health telemetry, and high-performance database
#  * connection pooling. Adheres to cloud-native and 12-factor app principles.
#  *
#  * @maintainer  Thinklab Systems Engineering Team
#  */
# ==============================================================================================

micronaut:
  application:
    name: micronaut-hash-service

  server:
    port: 8080
    cors:
      enabled: true

  # ----------------------------------------------------------------------------------------------
  # /**
  #  * @subsection  OpenAPI / Swagger Routing
  #  * @description Maps static classpath resources generated by the 'micronaut-openapi'
  #  * annotation processor during the build compilation phase. Exposes the API contract
  #  * and Swagger UI.
  #  */
  # ----------------------------------------------------------------------------------------------
  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Management Endpoints & Telemetry
#  * @description Exposes structural application telemetry and dynamic management interfaces.
#  * - health: Kubernetes native probes (Liveness/Readiness).
#  * - loggers: Allows real-time log level mutation without JVM restarts.
#  * - info: Exposes CI/CD build context and git commit hashes.
#  */
# ----------------------------------------------------------------------------------------------
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: ANONYMOUS
    kubernetes:
      enabled: true
  loggers:
    enabled: true
    sensitive: false
  info:
    enabled: true
    sensitive: false

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Data Persistence / MongoDB Driver
#  * @description Configures the MongoDB driver with production-grade constraints.
#  * Implements a robust connection pool topology, aggressive socket timeouts
#  * to prevent thread starvation, and majority write concerns to ensure
#  * strict data durability and consistency across replica sets.
#  *
#  * @tuning      uuid-representation: STANDARD - Mandated to resolve BSON
#  * CodecConfigurationException, enforcing RFC 4122 binary
#  * subtype 4 serialization for cross-language compatibility.
#  */
# ----------------------------------------------------------------------------------------------
mongodb:
  uri: ${MONGODB_URI:`mongodb://localhost:27017/hash_service`}
  uuid-representation: STANDARD
  connection-pool:
    max-size: 100
    min-size: 10
    max-wait-time: 120000ms
  socket:
    connect-timeout: 10000ms
    read-timeout: 15000ms
  write-concern:
    w: majority
    journal: true
  retry-writes: true

# ----------------------------------------------------------------------------------------------
# /**
#  * @section     Eager Initialization / Dependency Warm-up
#  * @description Configures external target URLs for the HttpWarmupObserver.
#  * These endpoints are proactively pinged during the application StartupEvent
#  * to resolve DNS, establish TCP connections, and complete SSL handshakes
#  * before the application accepts external traffic.
#  */
# ----------------------------------------------------------------------------------------------
warmup:
  endpoints:
    google-search: "https://www.google.com"